<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Ultra Voz Clone — seu estúdio de voz com IA.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Ultra Voz Clone</title>
  <style>
    :root { color-scheme: dark; --bg:#111827; --purple:#6d28d9; --lilac:#c4b5fd; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    #splash { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:linear-gradient(135deg,#111827 0%,#311a59 100%); transition:opacity .35s ease; }
    #splash.hide { opacity:0; pointer-events:none; }
    .logo { width:104px; height:104px; border-radius:27px; display:flex; align-items:center; justify-content:center; gap:8px; background:linear-gradient(135deg,#6d28d9,#4c1d95); box-shadow:0 14px 40px #0006; }
    .logo i { display:block; width:12px; border-radius:8px; background:white; }
    .logo i:nth-child(1){height:38px}.logo i:nth-child(2){height:60px;background:#c4b5fd}.logo i:nth-child(3){height:76px}.logo i:nth-child(4){height:48px}
    #splash h1 { margin:0; color:#fff; font-size:29px; letter-spacing:-.5px; }
    #splash p { margin:-8px 0 0; color:var(--lilac); font-size:15px; }
    #bar { position:fixed; top:0; left:0; right:0; height:54px; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:0 14px; padding-top:env(safe-area-inset-top); background:#111827ee; border-bottom:1px solid #ffffff16; backdrop-filter:blur(10px); }
    #brand { color:#fff; font-weight:700; font-size:16px; }
    #install { display:none; border:0; border-radius:999px; padding:9px 14px; color:#fff; background:var(--purple); font-weight:600; cursor:pointer; }
    #app { position:absolute; inset:54px 0 0; background:#fff; }
    iframe { display:block; width:100%; height:100%; border:0; background:#fff; }
    #fallback { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; background:#fff; color:#111827; opacity:0; pointer-events:none; }
    #fallback.visible { opacity:1; pointer-events:auto; }
    #fallback div { max-width:420px; }
    #fallback h2 { margin:0 0 8px; }
    #fallback p { color:#4b5563; line-height:1.5; }
    #fallback a { display:inline-block; margin-top:8px; padding:12px 18px; border-radius:10px; color:#fff; background:var(--purple); text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <div id="splash" aria-label="Carregando Ultra Voz Clone">
    <div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h1>Ultra Voz Clone</h1>
    <p>Seu estúdio de voz com IA</p>
  </div>
  <header id="bar"><div id="brand">Ultra Voz Clone</div><button id="install">Instalar app</button></header>
  <main id="app">
    <iframe id="site" title="Ultra Voz Clone" allow="microphone; camera; autoplay; clipboard-read; clipboard-write" src="https://vozo-voice-lab.base44.app/"></iframe>
    <div id="fallback"><div><h2>Abra o Ultra Voz Clone</h2><p>O navegador bloqueou a abertura incorporada. Toque no botão para abrir o estúdio em uma nova aba.</p><a href="https://vozo-voice-lab.base44.app/" target="_blank" rel="noopener">Abrir estúdio</a></div></div>
  </main>
  <script>
    const splash = document.getElementById('splash');
    const frame = document.getElementById('site');
    const fallback = document.getElementById('fallback');
    const install = document.getElementById('install');
    let deferredInstall;
    window.addEventListener('load', () => setTimeout(() => splash.classList.add('hide'), 900));
    frame.addEventListener('error', () => fallback.classList.add('visible'));
    window.addEventListener('beforeinstallprompt', event => { event.preventDefault(); deferredInstall = event; install.style.display='block'; });
    install.addEventListener('click', async () => { if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall=null; install.style.display='none'; });
    if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
